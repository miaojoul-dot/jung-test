    // ---------- 八维定义 ----------
    const dimensions = ['Ni', 'Ne', 'Si', 'Se', 'Ti', 'Te', 'Fi', 'Fe'];

        'Ti': '内向思考', 'Te': '外向思考', 'Fi': '内向情感', 'Fe': '外向情感'
    };
    
    // ---------- 72题题库（每道题增加大白话plain字段）----------
    function generatePlain(originalText, dim) {
        let plain = originalText;
        const replacements = [
            [/顿悟/g, '突然想明白一件事'],
            [/隐喻、象征/g, '比喻、符号背后的含义'],
            [/灵光一闪/g, '突然冒出的灵感'],
            [/预感到未来/g, '没理由地觉得接下来会发生什么'],
            [/抽象结构/g, '理论框架或模型'],
            [/干净的模式/g, '简洁清晰的规律'],
            [/脑洞/g, '天马行空的想法'],
            [/自由联想/g, '从一个念头跳到另一个不相关的念头'],
            [/浅尝辄止/g, '了解个大概就换下一个'],
            [/热衷追求新概念/g, '喜欢追新潮、新点子'],
            [/传统、惯例/g, '习惯的做法或老一辈传下来的规矩'],
            [/感官刺激/g, '视觉、听觉、味觉等直接体验'],
            [/活在当下/g, '专注于眼前的事，不纠结过去未来'],
            [/即兴发挥/g, '现场发挥，不提前准备'],
            [/底层逻辑/g, '事情背后的根本道理'],
            [/逻辑自洽/g, '自己跟自己不矛盾'],
            [/质疑权威/g, '不盲目相信专家或多数人'],
            [/共情/g, '体会别人的感受'],
            [/团队和谐/g, '让大家心情都舒服'],
            [/内心价值观/g, '自己觉得什么是对、什么是错'],
            [/违背良心/g, '做对不起自己原则的事']
        ];
        replacements.forEach(([regex, rep]) => { plain = plain.replace(regex, rep); });
        if (dim === 'Ni') return plain + '（举例：你相信直觉，喜欢琢磨隐藏的意义）';
        if (dim === 'Ne') return plain + '（举例：你擅长联想，喜欢 brainstorm 新花样）';
        if (dim === 'Si') return plain + '（举例：你依赖经验，注重细节和回忆）';
        if (dim === 'Se') return plain + '（举例：你享受当下的吃喝玩乐，对周围变化敏感）';
        if (dim === 'Ti') return plain + '（举例：你喜欢分析原理，自己搞懂逻辑）';
        if (dim === 'Te') return plain + '（举例：你重视效率，喜欢按计划做事）';
        if (dim === 'Fi') return plain + '（举例：你忠于内心感受，很在意自己的价值观）';
        if (dim === 'Fe') return plain + '（举例：你关注别人的情绪，喜欢营造融洽气氛）';
        return plain + '（通俗解释：这描述的是你的一种思维习惯）';
    }
    
    const rawQuestions = [

        { text: "使用各式各样的点子，以维持气氛的轻松和友好。", dim: "Fe" },
        { text: "易被周围的环境感染而感受到强烈的情绪冲动。", dim: "Fe" },

    if (rawQuestions.length !== 72) console.error("题目数量不对", rawQuestions.length);
    const questions = rawQuestions.map(q => ({
        text: q.text,
        dim: q.dim,
        plain: generatePlain(q.text, q.dim)
    }));
    
    let answers = new Array(72).fill(null);
    let currentIndex = 0;
    
    // DOM 元素
    const startPanel = document.getElementById('startPanel');
    const quizPanel = document.getElementById('quizPanel');
    const resultPanel = document.getElementById('resultPanel');
    const startBtn = document.getElementById('startTestBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const redoBtn = document.getElementById('redoBtn');
    const shareResBtn = document.getElementById('shareResBtn');
    const quizQuestion = document.getElementById('quizQuestion');
    const plainHint = document.getElementById('plainHint');
    const scaleOptions = document.getElementById('scaleOptions');
    const quizProgress = document.getElementById('quizProgress');
    const quizCounter = document.getElementById('quizCounter');
    const answeredHint = document.getElementById('answeredHint');
    
    function updateAnsweredHint() {
        const answeredCount = answers.filter(a => a !== null).length;
        answeredHint.innerText = `已完成 ${answeredCount}/${questions.length}`;
        if (currentIndex === questions.length - 1 && answers[currentIndex] !== null) {
            nextBtn.innerHTML = '完成测评 <i class="fas fa-check-circle"></i>';
        } else {
            nextBtn.innerHTML = '下一题 <i class="fas fa-arrow-right"></i>';
        }
    }
    
    // 自动前进或完成
    function autoAdvance() {
        // 当前题目已经保存了答案，决定下一步
        if (currentIndex + 1 < questions.length) {
            currentIndex++;
            renderCurrentQuestion();
        } else {
            // 已经是最后一题，完成测评
            finishQuizAndShowResult();
        }
    }
    
    // 处理选项点击 (保存 + 自动跳转)
    function onOptionClick(score) {
        // 保存当前答案
        answers[currentIndex] = score;
        updateAnsweredHint();
        // 高亮当前选项（视觉反馈）
        document.querySelectorAll('.scale-btn').forEach(btn => {
            btn.classList.remove('selected');
            if (parseInt(btn.dataset.score) === score) btn.classList.add('selected');
        });
        // 自动跳转下一题或完成
        autoAdvance();
    }
    
    function renderCurrentQuestion() {
        const q = questions[currentIndex];
        quizQuestion.innerText = q.text;
        plainHint.innerText = '💡 大白话：' + q.plain;
        const selectedVal = answers[currentIndex];
        let btnsHtml = '';
        for (let i = 1; i <= 5; i++) {
            let selectedClass = (selectedVal === i) ? 'selected' : '';
            btnsHtml += `<div class="scale-btn ${selectedClass}" data-score="${i}">${i}</div>`;
        }
        scaleOptions.innerHTML = btnsHtml;
        // 绑定事件
        document.querySelectorAll('.scale-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let score = parseInt(btn.dataset.score);
                // 防止重复点击同一选项多次触发自动跳转 (如果答案相同且已经跳转过，但不会，因为每次渲染都会重新绑定)
                // 但如果当前已经有答案并且再次点击相同的，仍然会保存并跳转，没问题；如果点击不同选项，更新并跳转。
                onOptionClick(score);
            });
        });
        const progressPercent = ((currentIndex + 1) / questions.length) * 100;
        quizProgress.style.width = `${progressPercent}%`;
        quizCounter.innerText = `第${currentIndex+1} / ${questions.length}题`;
        updateAnsweredHint();
        prevBtn.disabled = (currentIndex === 0);
    }
    
    function goPrev() {
        if (currentIndex > 0) {
            currentIndex--;
            renderCurrentQuestion();
        }
    }
    
    // 手动下一题
    function goNextManual() {
        if (answers[currentIndex] === null) {
            alert("请先选择一个选项（1～5）～ 选项越靠右越符合你");
            return;
        }
        if (currentIndex + 1 < questions.length) {
            currentIndex++;
            renderCurrentQuestion();
        } else {
            finishQuizAndShowResult();
        }
    }
    
    // 最终完成并展示结果
    function finishQuizAndShowResult() {
        // 确保所有题目都已作答
        const allAnswered = answers.every(a => a !== null);
        if (!allAnswered) {
            const missing = answers.reduce((cnt, a) => cnt + (a === null ? 1 : 0), 0);
            alert(`还剩 ${missing} 题未作答，请完成全部72道题才能查看深度报告～`);
            // 跳转到第一个未答题
            const firstNull = answers.findIndex(a => a === null);
            if (firstNull !== -1 && firstNull !== currentIndex) {
                currentIndex = firstNull;
                renderCurrentQuestion();
            }
            return;
        }
        const scores = computeScores();
        const mbti = computeMBTI(scores);
        const domAux = getDominantAuxiliary(scores, mbti);
        const overall = generateOverallTalk(scores, mbti, domAux);
        const candidates = getCandidateTypes(mbti);
        
        document.getElementById('mbtiType').innerHTML = `${mbti}`;
        document.getElementById('typeTitle').innerHTML = `${typeDesc[mbti] ? typeDesc[mbti].split('：')[0] : '认知整合型'} · 深度分析`;
        const scoresContainer = document.getElementById('scoresContainer');
        scoresContainer.innerHTML = '';
        for (let d of dimensions) {
            let scoreVal = scores[d];
            let percent = (scoreVal / 5) * 100;
            scoresContainer.innerHTML += `
                <div class="dim-item">
                    <div class="dim-name"><span>${dimChinese[d]} (${d})</span><span>${scoreVal.toFixed(1)}</span></div>
                    <div class="bar-bg"><div class="bar-fill" style="width: ${percent}%;"></div></div>
                </div>
            `;
        }
        document.getElementById('mainAnalysis').innerHTML = `<i class="fas fa-brain"></i> ${overall}<br><br>✨ 您的八维得分反映了您收集信息和做决策的深层偏好，主导功能是您最自然使用的认知镜头。`;
        const candidateContainer = document.getElementById('candidateTypes');
        candidateContainer.innerHTML = `<span style="font-size:0.8rem; color:#5a6e8a;">可能也匹配的类型：</span> ` + candidates.map(c => `<span class="type-candidate">${c}</span>`).join('');
        
        startPanel.classList.add('hidden');
        quizPanel.classList.add('hidden');
        resultPanel.classList.remove('hidden');
    }
    
    // 计算八维平均分
    function computeScores() {
        let dimSum = { 'Ni':0, 'Ne':0, 'Si':0, 'Se':0, 'Ti':0, 'Te':0, 'Fi':0, 'Fe':0 };
        let dimCount = { 'Ni':0, 'Ne':0, 'Si':0, 'Se':0, 'Ti':0, 'Te':0, 'Fi':0, 'Fe':0 };
        for (let i = 0; i < questions.length; i++) {
            let dim = questions[i].dim;
            let score = answers[i];
            if (score !== null) {
                dimSum[dim] += score;
                dimCount[dim]++;
            }
        }
        let avg = {};
        for (let d of dimensions) {
            avg[d] = dimCount[d] > 0 ? dimSum[d] / dimCount[d] : 2.5;
        }
        return avg;
    }
    
    function computeMBTI(scores) {
        let introSum = scores.Ni + scores.Si + scores.Ti + scores.Fi;
        let extraSum = scores.Ne + scores.Se + scores.Te + scores.Fe;
        const IE = introSum >= extraSum ? 'I' : 'E';
        let intuitionSum = scores.Ni + scores.Ne;
        let sensingSum = scores.Si + scores.Se;
        const NS = intuitionSum >= sensingSum ? 'N' : 'S';
        let thinkSum = scores.Ti + scores.Te;
        let feelSum = scores.Fi + scores.Fe;
        const TF = thinkSum >= feelSum ? 'T' : 'F';
        let judgeSum = scores.Te + scores.Fe;
        let perceSum = scores.Ne + scores.Se;
        const JP = judgeSum >= perceSum ? 'J' : 'P';
        return IE + NS + TF + JP;
    }
    
    function getDominantAuxiliary(scores, mbti) {
        const ie = mbti[0];
        let dominant = '', auxiliary = '';
        if (ie === 'I') {
            let inner = { Ni: scores.Ni, Si: scores.Si, Ti: scores.Ti, Fi: scores.Fi };
            dominant = Object.keys(inner).reduce((a,b) => inner[a] > inner[b] ? a : b);
            let outer = { Ne: scores.Ne, Se: scores.Se, Te: scores.Te, Fe: scores.Fe };
            auxiliary = Object.keys(outer).reduce((a,b) => outer[a] > outer[b] ? a : b);
        } else {
            let outer = { Ne: scores.Ne, Se: scores.Se, Te: scores.Te, Fe: scores.Fe };
            dominant = Object.keys(outer).reduce((a,b) => outer[a] > outer[b] ? a : b);
            let inner = { Ni: scores.Ni, Si: scores.Si, Ti: scores.Ti, Fi: scores.Fi };
            auxiliary = Object.keys(inner).reduce((a,b) => inner[a] > inner[b] ? a : b);
        }
        return { dominant, auxiliary };
    }
    
    const typeDesc = {
        'INTJ': '建筑师 · 战略家：富有想象力和战略思维，一切皆在计划之中。',
        'INTP': '逻辑学家 · 思考者：追求创新和逻辑，对知识有无尽的好奇心。',
        'INFJ': '提倡者 · 引路人：理想主义且富有原则，善于洞察他人。',
        'INFP': '调停者 · 理想家：敏感且富有同情心，追寻深层意义。',
        'ISTJ': '物流师 · 检查者：务实、严谨，重视传统和秩序。',
        'ISFJ': '守护者 · 照顾者：奉献、温暖，默默支持身边人。',
        'ISTP': '鉴赏家 · 实践者：大胆务实，擅长用双手解决问题。',
        'ISFP': '探险家 · 艺术家：敏感且艺术气质，享受当下自由。',
        'ENTJ': '指挥官 · 领袖：果断高效，天生带领团队前进。',
        'ENTP': '辩论家 · 发明家：机智善辩，热爱创新和挑战。',
        'ENFJ': '主人公 · 教育家：热情富有感染力，激励他人成长。',
        'ENFP': '竞选者 · 激励者：热情洋溢，充满可能性与创意。',
        'ESTJ': '监督者 · 管理者：高效务实，注重规则和执行。',
        'ESFJ': '执政官 · 东道主：友善合作，重视社群和谐。',
        'ESTP': '企业家 · 实干家：聪明精力充沛，善于抓住机会。',
        'ESFP': '表演者 · 乐天派：热爱生活，享受舞台和社交。'
    };
    
    function generateOverallTalk(scores, mbti, domAux) {
        const domName = dimChinese[domAux.dominant] || domAux.dominant;
        const auxName = dimChinese[domAux.auxiliary] || domAux.auxiliary;
        const typeChinese = typeDesc[mbti] ? mbti + ' · ' + typeDesc[mbti].split('：')[0] : mbti;
        return `根据您的72题深度测评，您的认知功能图谱显示：你最擅长「${domName}」作为主导功能，配合辅助功能「${auxName}」。你的MBTI类型最可能为 ${typeChinese}。${typeDesc[mbti] || '你的认知组合独特，善于在直觉、逻辑或情感之间找到自己的平衡。'}`;
    }
    
    function getCandidateTypes(mbti) {
        let candidates = [mbti];
        const m = mbti;
        if (m[0] === 'I') {
            candidates.push('E' + m.slice(1));
            candidates.push(m[0] + (m[1]==='N'?'S':'N') + m[2] + m[3]);
        } else {
            candidates.push('I' + m.slice(1));
            candidates.push(m[0] + (m[1]==='N'?'S':'N') + m[2] + m[3]);
        }
        return [...new Set(candidates.slice(0,4))];
    }
    
    function resetTest() {
        answers = new Array(72).fill(null);
        currentIndex = 0;
        startPanel.classList.remove('hidden');
        quizPanel.classList.add('hidden');
        resultPanel.classList.add('hidden');
        nextBtn.innerHTML = '下一题 <i class="fas fa-arrow-right"></i>';
        renderCurrentQuestion(); // 重新渲染初始状态，但此时面板隐藏，不会显示
    }
    
    function shareResult() {
        let type = document.getElementById('mbtiType').innerText;
        let mainText = document.getElementById('mainAnalysis').innerText.slice(0, 200);
        let shareContent = `【荣格八维专业版·大白话】我的认知类型是${type}！\n${mainText}\n测测你的思维使用说明书～`;
        if (navigator.share) {
            navigator.share({ title: '我的认知功能报告', text: shareContent }).catch(()=>{});
        } else {
            navigator.clipboard.writeText(shareContent).then(()=> alert('结果已复制，分享给朋友探索认知密码✨'));
        }
    }
    
    // 事件绑定
    startBtn.addEventListener('click', () => {
        resetTest();
        startPanel.classList.add('hidden');
        quizPanel.classList.remove('hidden');
        renderCurrentQuestion();
    });
    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNextManual);
    redoBtn.addEventListener('click', resetTest);
    shareResBtn.addEventListener('click', shareResult);
    // 初始化渲染（占位，但无显示）
    renderCurrentQuestion();
</script>
